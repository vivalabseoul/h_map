<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect width="400" height="250" rx="12" fill="#0F172A"/>
  
  <!-- 화려한 야간 불꽃/축제 현장 고화질 배경 사진 -->
  <image href="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&amp;fit=crop&amp;w=600&amp;q=80" width="400" height="250" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-default)"/>
  
  <!-- 가독성을 위한 딥 오버레이 -->
  <rect width="400" height="250" fill="url(#overlay-fest)" rx="12"/>
  
  <!-- 아트플로우맵 로고 핀 (public/logo.png 이미지 참조) -->
  <image href="/logo.png" x="165" y="48" width="70" height="81" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 텍스트 영역 (시그니처 주황색 포인트) -->
  <text x="50%" y="165" dominant-baseline="middle" text-anchor="middle" fill="#F97316" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="2">ART FLOW MAP</text>
  <text x="50%" y="190" dominant-baseline="middle" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">K-Local Festival Experience</text>

  <defs>
    <clipPath id="clip-default"><rect width="400" height="250" rx="12"/></clipPath>
    <linearGradient id="overlay-fest" x1="0" y1="0" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
</svg>
